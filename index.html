<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        /* Romantic Night-Sky Theme */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        #question-container, #success-container {
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap; /* Keeps it mobile-friendly */
        }

        button {
            padding: 15px 35px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #yes-btn {
            background-color: #ff4d6d;
            color: white;
            font-weight: bold;
        }

        #yes-btn:hover {
            background-color: #ff3355;
        }

        #no-btn {
            background-color: #555;
            color: white;
        }

        #success-container {
            display: none; /* Hidden until "Yes" is clicked */
        }

        .success-text {
            font-size: 1.5em;
            line-height: 1.6;
        }

        /* Celebratory Falling Hearts Animation */
        .heart {
            position: absolute;
            top: -10vh;
            font-size: 2em;
            animation: fall linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh);
            }
        }
    </style>
</head>
<body>

    <!-- Step 1: The Question & Interactive Buttons -->
    <div id="question-container">
        <h1>Will you marry me?</h1>
        <div class="buttons">
            <button id="yes-btn">Yes!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <!-- Step 2: The Grand Finale (Revealed after clicking Yes) -->
    <div id="success-container">
        <h1>YAY! 💖</h1>
        <p class="success-text">I love you so much!<br>I can't wait to spend forever with you.</p>
        <!-- You can easily add an <img> tag here for a cute GIF or photo -->
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const questionContainer = document.getElementById('question-container');
        const successContainer = document.getElementById('success-container');

        // Playful messages for the 'No' button
        const noMessages = [
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "You might regret this!",
            "Give it another thought!",
            "Are you absolutely certain?",
            "Have a heart!",
            "Don't be so cold!",
            "Change of heart?",
            "Is that your final answer?"
        ];
        
        let messageIndex = 0;
        let yesScale = 1;

        // Logic for clicking 'No'
        noBtn.addEventListener('click', () => {
            // Change the text of the No button
            noBtn.textContent = noMessages[messageIndex];
            messageIndex = (messageIndex + 1) % noMessages.length;

            // Progressively enlarge the Yes button
            yesScale += 0.4;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        // Logic for clicking 'Yes'
        yesBtn.addEventListener('click', () => {
            // 1. Hide the question and buttons
            questionContainer.style.display = 'none';
            
            // 2. Show the beautiful success message
            successContainer.style.display = 'block';
            
            // 3. Trigger the celebratory animation
            startCelebration();
        });

        // Function to create falling hearts
        function startCelebration() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️'; // You can change this to confetti emojis too (🎉, ✨)
                
                // Randomize starting position and fall speed
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's'; // Falls between 3-5 seconds
                
                document.body.appendChild(heart);

                // Clean up hearts after they fall off screen to keep the browser running smoothly
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 250); // Spawns a new heart every 250 milliseconds
        }
    </script>
</body>
  </html>
