<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propose Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating Hearts Background Animation */
    .heart-bg {
      position: absolute;
      color: rgba(233, 30, 99, 0.3);
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Main Container Card */
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
      text-align: center;
      max-width: 420px;
      width: 90%;
      z-index: 10;
      transition: all 0.3s ease-in-out;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 15px;
      display: block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      color: #333;
      margin-bottom: 15px;
      font-style: italic;
    }

    p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      align-items: center;
    }

    button {
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-yes {
      background-color: #e91e63;
      color: white;
    }

    .btn-yes:hover {
      background-color: #d81b60;
      transform: scale(1.05);
    }

    .btn-no {
      background-color: #f5f5f5;
      color: #555;
    }

    .btn-no:hover {
      background-color: #e0e0e0;
    }

    /* Confetti Styling for Success Screen */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #e91e63;
      animation: fall 3s linear infinite;
      z-index: 2;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <span class="emoji" id="emoji">💌</span>
    <h1 id="title">Hey Jaan! 💕</h1>
    <p id="message">I love you more than anything in this world. Will you be mine forever?</p>
    
    <div class="buttons">
      <button class="btn-yes" id="yesBtn" onclick="acceptProposal()">Yes</button>
      <button class="btn-no" id="noBtn" onclick="handleNo()">💔 No</button>
    </div>
  </div>

  <script>
    // Sequence of messages shown when "No" is clicked
    const steps = [
      {
        emoji: "🥺🥺",
        title: "Are you sure?",
        message: "You mean the whole world to me. Please say yes!",
        noText: "💔 No"
      },
      {
        emoji: "💔🥺",
        title: "My heart is breaking...",
        message: "I can't imagine a single day without you. Please give us a chance!",
        noText: "💔 No"
      },
      {
        emoji: "😭💖",
        title: "Please don't leave me...",
        message: "You're my everything. Say yes and make me the happiest person alive!",
        noText: "💔 No"
      }
    ];

    let currentStep = 0;
    let yesScale = 1;

    // Handle clicking "No"
    function handleNo() {
      if (currentStep < steps.length) {
        const step = steps[currentStep];
        document.getElementById('emoji').innerText = step.emoji;
        document.getElementById('title').innerText = step.title;
        document.getElementById('message').innerText = step.message;
        document.getElementById('noBtn').innerText = step.noText;
        currentStep++;
      } else {
        // Grow the "Yes" button progressively
        yesScale += 0.35;
        document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;
      }
    }

    // Handle clicking "Yes"
    function acceptProposal() {
      document.getElementById('card').innerHTML = `
        <span class="emoji">💖🎉</span>
        <h1>You said YES! 🥳</h1>
        <p>I love you, Jaan. Let's make forever amazing! 💞</p>
      `;
      createConfetti();
    }

    // Create background floating hearts
    function createHearts() {
      const heartSymbols = ['❤️', '💖', '💗', '💓', '💕'];
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart-bg');
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }, 400);
    }

    // Create celebratory confetti on "Yes"
    function createConfetti() {
      const colors = ['#e91e63', '#ff4081', '#ff80ab', '#ffffff'];
      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confetti.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(confetti);
      }
    }

    createHearts();
  </script>
</body>
</html>
