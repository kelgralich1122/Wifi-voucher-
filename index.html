<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Deejah 🌙💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Prevents text selection highlighting on mobile tap */
      -webkit-tap-highlight-color: transparent; 
    }

    body {
      /* A magical twilight romantic gradient for "ya Qamar" */
      background: linear-gradient(135deg, #1b1432, #471944, #a43a60);
      background-size: 200% 200%;
      animation: gradientBG 10s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Moons, Stars, and Hearts */
    .floating-icon {
      position: absolute;
      font-size: 24px;
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Container Card */
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 90%;
      width: 380px;
      z-index: 10;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease-in-out;
    }

    .emoji {
      font-size: 65px;
      margin-bottom: 10px;
      display: block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    h1 {
      font-family: 'Georgia', serif;
      font-size: 26px;
      color: #333;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap; /* Allows buttons to wrap if Yes gets too big */
    }

    button {
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn-yes {
      background: linear-gradient(45deg, #e91e63, #ff4081);
      color: white;
      z-index: 20;
    }

    .btn-yes:active {
      transform: scale(0.95);
    }

    .btn-no {
      background-color: #f0f0f0;
      color: #666;
    }

    /* Confetti for when she says Yes */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: fall linear forwards;
      z-index: 20;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <span class="emoji" id="emoji">🌙💖</span>
    <h1 id="title">Hey Deejah<br>[ya Qamar] ✨</h1>
    <p id="message">From being my amazing bestie to my ultimate crush, and now my wonderful partner... you light up my world like the moon. Will you be mine forever? <br><br>— Yours, lemini</p>
    
    <div class="buttons">
      <button class="btn-yes" id="yesBtn" onclick="acceptProposal()">Yes!</button>
      <button class="btn-no" id="noBtn" onclick="handleNo()">No 💔</button>
    </div>
  </div>

  <script>
    // Custom messages tailored to your relationship
    const steps = [
      {
        emoji: "🥺🥺",
        title: "Wait, are you sure?",
        message: "But we're literally besties! You can't say no to your lemini 🥺",
        noText: "Still No"
      },
      {
        emoji: "💔😢",
        title: "Ya Qamar, don't do this!",
        message: "You're my crush and my partner! Don't break my heart! Give us a chance!",
        noText: "Nope"
      },
      {
        emoji: "😭✨",
        title: "Please don't leave me...",
        message: "You are my moon and my stars. Just tap YES! Make me the happiest person alive!",
        noText: "No way"
      }
    ];

    let currentStep = 0;
    let yesScale = 1;
    let noScale = 1;

    // Handle tapping "No"
    function handleNo() {
      // 1. Change text up to 3 times
      if (currentStep < steps.length) {
        const step = steps[currentStep];
        document.getElementById('emoji').innerText = step.emoji;
        document.getElementById('title').innerText = step.title;
        document.getElementById('message').innerText = step.message;
        document.getElementById('noBtn').innerText = step.noText;
        currentStep++;
      } 
      
      // 2. On mobile, we make the YES button huge and the NO button tiny on every tap
      yesScale += 0.4; // Yes button gets bigger
      noScale -= 0.15; // No button gets smaller
      
      document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;
      document.getElementById('yesBtn').style.margin = `${yesScale * 10}px`;
      
      // Hide the 'No' button completely if it gets too small
      if (noScale <= 0.2) {
        document.getElementById('noBtn').style.display = 'none';
      } else {
        document.getElementById('noBtn').style.transform = `scale(${noScale})`;
      }
    }

    // Handle tapping "Yes"
    function acceptProposal() {
      document.getElementById('card').innerHTML = `
        <span class="emoji">💍🥰</span>
        <h1>She said YES! 🎉</h1>
        <p>I love you infinitely, Deejah ya Qamar. Let's make forever amazing! 💞<br><br>— lemini</p>
      `;
      createConfetti();
      document.getElementById('card').style.transform = 'scale(1.05)';
    }

    // Create magical background floating icons (Moons, Stars, Hearts)
    function createFloatingIcons() {
      const symbols = ['🌙', '✨', '💖', '⭐', '💕'];
      setInterval(() => {
        const icon = document.createElement('div');
        icon.classList.add('floating-icon');
        icon.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        icon.style.left = Math.random() * 100 + 'vw';
        icon.style.animationDuration = (Math.random() * 4 + 5) + 's'; // 5s to 9s float time
        icon.style.fontSize = (Math.random() * 15 + 15) + 'px'; // Varying sizes
        document.body.appendChild(icon);

        // Remove from DOM after animation completes to prevent lag
        setTimeout(() => {
          icon.remove();
        }, 9000);
      }, 300);
    }

    // Create celebratory confetti on "Yes"
    function createConfetti() {
      const colors = ['#e91e63', '#ff4081', '#ff80ab', '#ffd700', '#ffffff'];
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        // Randomize shape (some circles, some squares)
        if (Math.random() > 0.5) {
          confetti.style.borderRadius = '50%';
        }
        
        confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confetti);
      }
    }

    // Start background animation
    createFloatingIcons();
  </script>
</body>
</html>
