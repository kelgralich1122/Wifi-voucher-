<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5c8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LOVE RUSH ❤️ — 2 Player Heart Chase</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #ff5c8a 0%, #ff8fab 100%);
            overflow: hidden;
        }

        .loading-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .file-list {
            color: white;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
        }

        .file-item {
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loader-text">🎮 Extracting LOVE RUSH Game Files...</div>
        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        const fileList = document.getElementById('fileList');
        
        // List of files in the ZIP that we'll extract
        const zipUrl = 'https://github.com/kelgralich1122/Wifi-voucher-/raw/main/build-love-rush-game.zip';

        async function extractZip() {
            try {
                const response = await fetch(zipUrl);
                const arrayBuffer = await response.arrayBuffer();
                const zip = new JSZip();
                const contents = await zip.loadAsync(arrayBuffer);

                let fileCount = 0;
                const files = Object.keys(contents.files);

                fileList.innerHTML = '';

                for (const filename of files) {
                    if (!contents.files[filename].dir) {
                        fileCount++;
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.textContent = `✓ ${filename}`;
                        fileList.appendChild(item);
                    }
                }

                document.querySelector('.loader-text').textContent = `✅ Found ${fileCount} files! Game is ready to play...`;
                
                // Load the main HTML after a short delay
                setTimeout(() => {
                    window.location.href = '/docs/index.html';
                }, 2000);

            } catch (error) {
                console.error('Error extracting ZIP:', error);
                fileList.innerHTML = '<div class="file-item" style="color: #ffcccc;">❌ Error loading game. Please try refreshing.</div>';
            }
        }

        // Start extraction
        extractZip();
    </script>
</body>
</html>
