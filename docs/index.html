<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff5c8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LOVE RUSH ❤️ — 2 Player Heart Chase</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: 'Fredoka', sans-serif;
        background: linear-gradient(135deg, #ff5c8a 0%, #ff8fab 100%);
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .game-container {
        width: 100%;
        height: 100%;
        max-width: 1024px;
        max-height: 768px;
        position: relative;
        background: linear-gradient(135deg, #ff5c8a 0%, #ff8fab 100%);
        overflow: hidden;
      }

      .game-title {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 32px;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        z-index: 10;
      }

      .game-board {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .player {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: move;
        transition: transform 0.1s ease;
      }

      .player1 {
        background: rgba(255, 107, 107, 0.8);
        border: 3px solid white;
      }

      .player2 {
        background: rgba(255, 142, 167, 0.8);
        border: 3px solid white;
      }

      .heart {
        position: absolute;
        font-size: 24px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        50% {
          transform: translateY(-20px) scale(1.1);
        }
      }

      .controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        text-align: center;
        font-size: 14px;
        z-index: 10;
      }

      .score {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 24px;
        font-weight: 600;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        z-index: 10;
      }

      .btn-reset {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        background: white;
        color: #ff5c8a;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transition: transform 0.2s ease;
      }

      .btn-reset:hover {
        transform: scale(1.05);
      }

      .btn-reset:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="game-container">
        <div class="game-title">LOVE RUSH ❤️</div>
        <div class="score">
          <span id="score1">Player 1: 0</span> | <span id="score2">Player 2: 0</span>
        </div>
        <div class="game-board" id="gameBoard"></div>
        <button class="btn-reset" onclick="location.reload()">New Game</button>
        <div class="controls">
          <div>Player 1: Arrow Keys | Player 2: WASD</div>
          <div>Collect Hearts to Score! ❤️</div>
        </div>
      </div>
    </div>

    <script>
      const gameBoard = document.getElementById('gameBoard');
      const score1El = document.getElementById('score1');
      const score2El = document.getElementById('score2');

      let player1 = { x: 100, y: 100, size: 40, score: 0 };
      let player2 = { x: 900, y: 600, size: 40, score: 0 };
      let hearts = [];
      let keys = {};

      const width = window.innerWidth;
      const height = window.innerHeight;

      function spawnHeart() {
        const heart = {
          x: Math.random() * (width - 50),
          y: Math.random() * (height - 150) + 80,
          size: 24,
          eaten: false
        };
        hearts.push(heart);
        renderHeart(heart);
      }

      function renderHeart(heart) {
        const div = document.createElement('div');
        div.className = 'heart';
        div.textContent = '❤️';
        div.style.left = heart.x + 'px';
        div.style.top = heart.y + 'px';
        div.id = 'heart-' + hearts.indexOf(heart);
        gameBoard.appendChild(div);
      }

      function renderPlayers() {
        let p1 = document.getElementById('player1');
        let p2 = document.getElementById('player2');

        if (!p1) {
          p1 = document.createElement('div');
          p1.id = 'player1';
          p1.className = 'player player1';
          p1.textContent = '💕';
          gameBoard.appendChild(p1);
        }
        if (!p2) {
          p2 = document.createElement('div');
          p2.id = 'player2';
          p2.className = 'player player2';
          p2.textContent = '💗';
          gameBoard.appendChild(p2);
        }

        p1.style.left = player1.x + 'px';
        p1.style.top = player1.y + 'px';

        p2.style.left = player2.x + 'px';
        p2.style.top = player2.y + 'px';
      }

      function checkCollision(p1, p2) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        return distance < p1.size + p2.size;
      }

      function update() {
        const speed = 8;

        // Player 1 controls (Arrow Keys)
        if (keys['ArrowUp']) player1.y = Math.max(80, player1.y - speed);
        if (keys['ArrowDown']) player1.y = Math.min(height - player1.size, player1.y + speed);
        if (keys['ArrowLeft']) player1.x = Math.max(0, player1.x - speed);
        if (keys['ArrowRight']) player1.x = Math.min(width - player1.size, player1.x + speed);

        // Player 2 controls (WASD)
        if (keys['w'] || keys['W']) player2.y = Math.max(80, player2.y - speed);
        if (keys['s'] || keys['S']) player2.y = Math.min(height - player2.size, player2.y + speed);
        if (keys['a'] || keys['A']) player2.x = Math.max(0, player2.x - speed);
        if (keys['d'] || keys['D']) player2.x = Math.min(width - player2.size, player2.x + speed);

        // Check heart collisions
        hearts.forEach((heart, idx) => {
          if (checkCollision(player1, heart)) {
            player1.score++;
            heart.eaten = true;
            score1El.textContent = 'Player 1: ' + player1.score;
            document.getElementById('heart-' + idx)?.remove();
          }
          if (checkCollision(player2, heart)) {
            player2.score++;
            heart.eaten = true;
            score2El.textContent = 'Player 2: ' + player2.score;
            document.getElementById('heart-' + idx)?.remove();
          }
        });

        hearts = hearts.filter(h => !h.eaten);

        renderPlayers();
      }

      function gameLoop() {
        update();
        requestAnimationFrame(gameLoop);
      }

      // Keyboard events
      document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
      });

      document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      // Spawn hearts periodically
      setInterval(spawnHeart, 1000);

      renderPlayers();
      gameLoop();
    </script>
  </body>
</html>
